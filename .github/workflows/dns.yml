# Operator tool: upsert one DNS record in the tocsin.sh zone with the repo's Cloudflare token.
# Manual dispatch only. Used for the mail records (SPF, DKIM, DMARC, MailChannels lockdown).
name: dns
on:
  workflow_dispatch:
    inputs:
      name:
        description: Record name (e.g. tocsin.sh, _dmarc.tocsin.sh, mcdkim._domainkey.tocsin.sh)
        required: true
      type:
        description: Record type
        required: true
        type: choice
        options: [TXT, CNAME, A, AAAA, MX]
      content:
        description: Record content (TXT without surrounding quotes)
        required: true
      ttl:
        description: TTL in seconds (1 = auto)
        required: false
        default: "1"
permissions: { contents: read }
jobs:
  upsert:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: tocsin.sh
    steps:
      - name: Upsert the record
        env:
          NAME: ${{ inputs.name }}
          TYPE: ${{ inputs.type }}
          CONTENT: ${{ inputs.content }}
          TTL: ${{ inputs.ttl }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          zone=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -r '.result[0].id')
          [ -n "$zone" ] && [ "$zone" != "null" ] || { echo "::error::zone $ZONE_NAME not found or token lacks zone read"; exit 1; }
          existing=$(api "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?type=$TYPE&name=$NAME" | jq -r '.result[0].id // empty')
          body=$(jq -n --arg t "$TYPE" --arg n "$NAME" --arg c "$CONTENT" --argjson ttl "$TTL" '{type:$t,name:$n,content:$c,ttl:$ttl}')
          if [ -n "$existing" ]; then
            out=$(api -X PUT "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$existing" --data "$body"); verb=updated
          else
            out=$(api -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" --data "$body"); verb=created
          fi
          echo "$out" | jq -e '.success' >/dev/null || { echo "::error::$(echo "$out" | jq -c '.errors')"; exit 1; }
          echo "$verb $TYPE $NAME -> $(echo "$out" | jq -r '.result.content' | cut -c1-80)"
