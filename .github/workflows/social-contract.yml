name: social-contract

# Real-vendor contract suite of the X seam (src/social/x.ts, TCS-106). Off the
# PR path: on main, nightly, and on a PR only when it changes the X adapter,
# its OAuth signer or the suite. Each test skips when an X secret is not set.
# The post test makes one real post to @tocsinagent per run (about $0.20) and
# deletes it at once. A billing answer (no credits), a 429, a 5xx or a
# network error skips the test with a vendor_failure alert line, never a red run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 4 * * *"
  pull_request:
    paths:
      - "src/social/x.ts"
      - "src/social/oauth1.ts"
      - "tests/contract/social-x.contract.tcs-106.test.ts"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    concurrency: social-contract
    env:
      X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
      X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contract -- tests/contract/social-x.contract.tcs-106.test.ts
