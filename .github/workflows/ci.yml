name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gen:schema -- --check
      - run: npm run gen:docs -- --check
      - run: npm run gen:skills -- --check
      # Skips with a reason when the runner has no claude CLI (GitHub runners have none).
      - run: bash scripts/validate-plugin.sh
      - run: npm test

  # Runs only after an operator creates the Cloudflare resources and sets the
  # repo variable DEPLOY_ENABLED=1 (see README, "Deploy").
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == '1'
    runs-on: ubuntu-latest
    concurrency: deploy-main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # wrangler deploy fails when a queue that wrangler.toml names does not
      # exist. Create the dead-letter queue (TCS-82) when it is missing, so no
      # deploy waits on a hand step. An error other than "missing" stops here.
      - run: npx wrangler queues info deliveries-dlq || npx wrangler queues create deliveries-dlq
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - run: npx wrangler deploy -c workers/mcp/wrangler.toml
