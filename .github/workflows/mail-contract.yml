name: mail-contract

# Real-vendor contract suite of the mail seam (src/mail/send.ts). Off the PR
# path: on main, nightly, and on a PR only when it changes the mail adapter.
# Every call is a MailChannels dry run: no mail leaves, nothing is spent.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    paths:
      - "src/mail/**"
      - "tests/contract/mail.contract.tcs-64.test.ts"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    concurrency: mail-contract
    env:
      MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --project contract --maxWorkers=1
