name: mail-contract

# Real-vendor contract suite of the mail seam (src/mail/send.ts). Off the PR
# path: on main, nightly, and on a PR only when it changes the mail adapter.
# Two suites: MailChannels (every call a dry run, no mail, no spend) and Resend
# (TCS-97: one real send per run to delivered@resend.dev). Each suite skips
# when its key is not set, so the job runs whichever key exists. The GitHub
# OIDC suite (TCS-101) needs no key: it reads GitHub's public key set.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    paths:
      - "src/mail/**"
      - "tests/contract/mail.contract.tcs-64.test.ts"
      - "tests/contract/mail-resend.contract.tcs-97.test.ts"
      - "src/lib/github-oidc.ts"
      - "tests/contract/github-oidc.contract.tcs-101.test.ts"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    concurrency: mail-contract
    env:
      MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contract
