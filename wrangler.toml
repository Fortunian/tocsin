name = "tocsin"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
account_id = "11b818a4b2a98b4b5012359edb39cae8"

# Custom domain: Cloudflare creates the DNS record and certificate on deploy.
routes = [{ pattern = "tocsin.sh", custom_domain = true }]

# The resource ids below are placeholders. An operator creates each resource
# once and pastes the real id here:
#   wrangler d1 create tocsin
#   wrangler kv namespace create CURSORS
#   wrangler queues create deliveries
#   wrangler queues create deliveries-dlq
[[d1_databases]]
binding = "DB"
database_name = "tocsin"
database_id = "0c4a3bd5-e93f-40b9-92c0-3df820557669"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CURSORS"
id = "2a4feb92a3ae44a4a8e12de868a2426a"

[[queues.producers]]
binding = "DELIVERIES"
queue = "deliveries"

# Consumer settings are deploy config: the Worker cannot read them from D1,
# so they are not settings rows. Each message is one delivery; a retry of a
# failed POST is our own delayed message, never msg.retry(). The queue retries
# a message only when the consumer throws; after max_retries it moves the
# message to deliveries-dlq, whose consumer marks the row failed with
# last_error dead_letter (src/queue/run.ts runDeadLetters).
[[queues.consumers]]
queue = "deliveries"
max_batch_size = 10
max_retries = 3
max_concurrency = 5
dead_letter_queue = "deliveries-dlq"

[[queues.consumers]]
queue = "deliveries-dlq"
max_batch_size = 10

[triggers]
# */10: ingest, then webhook enqueue and sweep. 17 3 1 * *: monthly API key
# retention (src/cron/run.ts RETENTION_CRON). 41 4 * * *: daily deliveries
# retention (DELIVERY_RETENTION_CRON).
crons = ["*/10 * * * *", "17 3 1 * *", "41 4 * * *"]
